# GRID CI (template from cobanana-core/ci/ci.yml): every push and PR, Linux only, cheap — typecheck, unit/golden/
# persona/level tests, sidecar build, Godot UI smoke. Exports and macOS/Windows packaging run only on v* tags (release.yml):
# private-repo Actions minutes are limited.
# SUBMODULE ACCESS: core/ is a git submodule with the RELATIVE url `../cobanana-core`, which resolves against this repo's
# remote (https://github.com/<owner>/cobanana-core in Actions). cobanana-core is private and a game repo's GITHUB_TOKEN cannot
# read it, so every job checks the game out with its own token WITHOUT submodules, then fetches core over SSH with the
# read-only deploy key stored as the secret CORE_SSH_KEY (url.insteadOf rewrites the resolved https url to SSH).
# Do NOT pass the deploy key to actions/checkout's `ssh-key`: it would also be used for the game repo, which it cannot read.
name: ci
on:
  workflow_dispatch:   # by hand only: tests run locally (make test, make flows); Actions minutes are for release builds
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.7.2
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4          # the game repo, with this repo's token (no submodules yet)
      - name: Core submodule over SSH (deploy key CORE_SSH_KEY)
        env: { CORE_SSH_KEY: "${{ secrets.CORE_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_key && chmod 600 ~/.ssh/core_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/core_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:${{ github.repository_owner }}/cobanana-core".insteadOf "https://github.com/${{ github.repository_owner }}/cobanana-core"
          git submodule update --init --recursive
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      # wall-clock perf budgets run locally only (`pnpm perf`), not on the shared runner: decided by the manager 11-22 (factory DECISIONS 8), reversible
      - run: ./node_modules/.bin/vitest run --exclude src/perf.test.ts --exclude src/sim/loadflow/perf.test.ts   # wall-clock budgets are local only (DECISIONS 8): pnpm perf
        env:
          CB_WALLCLOCK_OFF: "1"
      - name: Build the engine sidecar
        run: ./node_modules/.bin/vite build -c vite.bridge.config.ts
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with: { path: ~/godot-bin, key: "godot-${{ env.GODOT_VERSION }}" }
      - name: Godot
        run: |
          if [ ! -x ~/godot-bin/godot ]; then
            base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
            curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            mkdir -p ~/godot-bin && unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
      - name: UI smoke test (every screen)
        run: |
          godot --headless --path godot --import >/dev/null 2>&1 || true
          godot --headless --path godot --import >/dev/null 2>&1 || true   # second pass: generated translations now exist
          # the shared runner (core/qa/run-flow.sh) fails the smoke on SMOKE OK missing, a timeout, or a script error in the log (SCRIPT ERROR, Parse Error, Error calling ...)
          CB_FLOW_TAIL=80 CB_SMOKE=1 core/qa/run-flow.sh -k smoke -T 180 -o "$RUNNER_TEMP/flows" --

  # The Godot flow suite (GRID: the world-truth tests, chapter flows, smoke and text audit via scripts/test-godot.mjs), through the shared runner core/qa/run-flow.sh: a flow fails on a script error in its log, a missing OK line, a
  # timeout, or a check count under flow-min.txt. A separate job so the 20-minute limit of test-and-smoke is not shared with the flows.
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4          # the game repo, with this repo's token (no submodules yet)
      - name: Core submodule over SSH (deploy key CORE_SSH_KEY)
        env: { CORE_SSH_KEY: "${{ secrets.CORE_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_key && chmod 600 ~/.ssh/core_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/core_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:${{ github.repository_owner }}/cobanana-core".insteadOf "https://github.com/${{ github.repository_owner }}/cobanana-core"
          git submodule update --init --recursive
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with: { path: ~/godot-bin, key: "godot-${{ env.GODOT_VERSION }}" }
      - name: Godot
        run: |
          if [ ! -x ~/godot-bin/godot ]; then
            base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
            curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            mkdir -p ~/godot-bin && unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
      - name: Godot flows
        run: CB_FLOW_LOGS="$RUNNER_TEMP/flows" CB_FLOW_TAIL=60 node scripts/test-godot.mjs
      - name: Flow logs
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: flow-logs, path: "${{ runner.temp }}/flows", if-no-files-found: ignore }
