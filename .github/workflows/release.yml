# GRID release workflow (template from cobanana-core/ci/release.yml; the scaffold substitutes GRID and grid).
#
# SUBMODULE ACCESS: core/ is a git submodule with the RELATIVE url `../cobanana-core`, which resolves against this repo's
# remote (https://github.com/<owner>/cobanana-core in Actions). cobanana-core is private and a game repo's GITHUB_TOKEN cannot
# read it, so every job checks the game out with its own token WITHOUT submodules, then fetches core over SSH with the
# read-only deploy key stored as the secret CORE_SSH_KEY (url.insteadOf rewrites the resolved https url to SSH).
# Do NOT pass the deploy key to actions/checkout's `ssh-key`: it would also be used for the game repo, which it cannot read.
#
# Cost: this workflow runs only on v* tags (and by hand); pushes run the cheap Linux-only ci.yml.
# Flow: tag v* -> export, package x4, publish (GitHub release with notes from CHANGELOG.md + SHA256SUMS.txt).
# The release notes come from the CHANGELOG.md heading containing `[x.y.z]`. The Android APK is built by hand
# (see core/android/README.md) and uploaded with `gh release upload`.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version: { description: 'version label (no publish on manual runs)', default: 'dev' }
      tag: { description: 'backfill: build this tag''s game with this commit''s packaging (artifacts only, no publish)', default: '' }

env:
  GODOT_VERSION: 4.7.2
  NODE_VERSION: 22.23.4
  REL_VER: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || inputs.version || 'dev' }}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # the game repo, with this repo's token (no submodules yet)
        with: { ref: "${{ inputs.tag || github.ref }}" }   # a backfill builds the tag's game
      - name: Core submodule over SSH (deploy key CORE_SSH_KEY)
        env: { CORE_SSH_KEY: "${{ secrets.CORE_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_key && chmod 600 ~/.ssh/core_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/core_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:${{ github.repository_owner }}/cobanana-core".insteadOf "https://github.com/${{ github.repository_owner }}/cobanana-core"
          git submodule update --init --recursive
      - name: Backfill only, packaging from this commit (presets + core/ci), everything else from the tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git fetch -q --no-tags origin "$GITHUB_SHA"
          git checkout -q "$GITHUB_SHA" -- godot/export_presets.cfg
          c=$(git ls-tree "$GITHUB_SHA" core | awk '{print $3}')
          git -C core fetch -q origin "$c" && git -C core checkout -q "$c" -- ci
          git status --short
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - name: Build the engine sidecar
        run: ./node_modules/.bin/vite build -c vite.bridge.config.ts
      - name: Godot + export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          d=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $d && unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* $d/
      - name: Export
        run: |
          mkdir -p godot/build/linux godot/build/windows godot/build/macos
          core/ci/prep-export.sh godot "$REL_VER"   # stamps the macOS version; fails on a missing icon (that was the macOS failure)
          godot --headless --path godot --import || true
          for p in Linux Windows macOS; do godot --headless --path godot --export-release "$p" || exit 1; done
          ls -R godot/build
      - uses: actions/upload-artifact@v4
        with:
          name: godot-export
          path: |
            godot/build
            godot/sidecar/bridge.mjs

  package:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux,   os: ubuntu-latest }
          - { target: windows, os: ubuntu-latest }
          - { target: macos,   os: macos-latest }    # universal (arm64 + x86_64); signed ad hoc and smoke-run on the Mac runner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4          # the game repo, with this repo's token (no submodules yet)
        with: { ref: "${{ inputs.tag || github.ref }}" }   # a backfill builds the tag's game
      - name: Core submodule over SSH (deploy key CORE_SSH_KEY)
        env: { CORE_SSH_KEY: "${{ secrets.CORE_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_key && chmod 600 ~/.ssh/core_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i ~/.ssh/core_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:${{ github.repository_owner }}/cobanana-core".insteadOf "https://github.com/${{ github.repository_owner }}/cobanana-core"
          git submodule update --init --recursive
      - name: Backfill only, packaging from this commit (presets + core/ci), everything else from the tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git fetch -q --no-tags origin "$GITHUB_SHA"
          git checkout -q "$GITHUB_SHA" -- godot/export_presets.cfg
          c=$(git ls-tree "$GITHUB_SHA" core | awk '{print $3}')
          git -C core fetch -q origin "$c" && git -C core checkout -q "$c" -- ci
          git status --short
      # the artifact holds build/<os>/... and sidecar/bridge.mjs (common ancestor godot/ is stripped)
      - uses: actions/download-artifact@v4
        with: { name: godot-export, path: ex }
      - name: Put the sidecar where package.sh expects it
        run: mkdir -p godot/sidecar && cp ex/sidecar/bridge.mjs godot/sidecar/bridge.mjs
      - name: Node runtime (pinned, checksum-checked; universal for macOS)
        run: core/ci/node-runtime.sh ${{ matrix.target }} "$NODE_VERSION" nodedist
      - name: Package
        run: |
          core/ci/package.sh ${{ matrix.target }} ex/build/$(echo ${{ matrix.target }} | sed 's/-.*//') nodedist dist "$REL_VER" GRID grid
      - name: Verify the macOS app (layout, Info.plist, both architectures, signature, packaged headless smoke)
        if: matrix.target == 'macos'
        run: |
          core/ci/verify-macos.sh dist/*-macos.zip GRID "${REL_VER#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      # A release built and smoke-tested locally (scripts/release-local.sh) must never be overwritten or
      # duplicated by CI builds: if the tag already has a release, publish nothing.
      - name: Skip if the release already exists
        id: exists
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists (local, smoke-tested): not publishing"; echo "skip=1" >> "$GITHUB_OUTPUT"
          else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.skip == '0'
        with: { pattern: dist-*, path: dist, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        if: steps.exists.outputs.skip == '0'
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > notes.md
          printf '\n---\nDownload the archive for your OS, extract, and run. Node.js is bundled; nothing else to install.\n- **Windows**: unzip, run `GRID\\GRID.exe` (SmartScreen: More info, Run anyway; builds are unsigned).\n- **Linux (x86_64)**: `tar xf`, run `GRID/grid.sh`. Needs a Vulkan-capable GPU/driver.\n- **macOS (untested)**: unzip, then right-click `GRID.app` and choose Open (not signed by Apple; on macOS 15 and later use System Settings > Privacy & Security > Open Anyway).\n' > tail.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $ver"; exit 1; }
          cat tail.md >> notes.md
      - run: cd dist && sha256sum * > SHA256SUMS.txt && ls -la
        if: steps.exists.outputs.skip == '0'
      - uses: softprops/action-gh-release@v2
        if: steps.exists.outputs.skip == '0'
        with:
          files: dist/*
          body_path: notes.md
